# Combined docker-compose for Atlas Insights.
#   - api: NestJS service on the internal network (not exposed publicly here).
#   - web: nginx serving the Vite bundle + reverse-proxying /api to `api`.
#
# Usage:
#   docker compose up --build
#   open http://localhost:8080
#
# Env: values fall back to sane defaults; override via a root .env file.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: atlas-insights/api:local
    environment:
      API_PORT: "3000"
      API_HOST: 0.0.0.0
      # Allow the nginx-served origin. Add more comma-separated entries as needed.
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:8080}
      USGS_FEED_URL: ${USGS_FEED_URL:-https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_month.csv}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-60}
      THROTTLE_WINDOW_SECONDS: ${THROTTLE_WINDOW_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_USE_DIRECT_FEED: "false"
    image: atlas-insights/web:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  default:
    name: atlas-insights

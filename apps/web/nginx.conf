# nginx config for the web container.
# - Serves the Vite SPA bundle from /usr/share/nginx/html.
# - Reverse-proxies /api/* to the api service on the docker network.
# - Adds a small set of security headers (helmet covers the API; this covers
#   the static surface).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived cache for hashed asset files; short for the entrypoint HTML.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — every unknown route serves index.html.
    location / {
        try_files $uri /index.html;
    }

    # Reverse proxy to the NestJS API. `api` is the service name in compose.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Lightweight liveness endpoint for compose / k8s probes.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
